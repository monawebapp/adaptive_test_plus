name: Format and update goldens
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - id: dotenv
        uses: falti/dotenv-action@v0.2.8
        with:
          path: .github/workflows/.env

      - uses: subosito/flutter-action@v2.5.0
        with:
          flutter-version: ${{ steps.dotenv.outputs.flutter_version }}
          channel: "stable"
          cache: true
          cache-key: flutter-macos-${{ steps.dotenv.outputs.flutter_version }}
          cache-path: ${{ runner.tool_cache }}/flutter-${{ steps.dotenv.outputs.flutter_version }}

      - name: Format
        run: dart format lib test example

      - name: Regenerate goldens
        run: |
          for dir in example/simple_app example/multi_packages_app/app example/multi_packages_app/theme; do
            (cd "$dir" && flutter pub get && flutter test --update-goldens)
          done

      - name: Commit goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib test example
          git diff --cached --quiet || git commit -m "chore: format and update goldens"
          git push
