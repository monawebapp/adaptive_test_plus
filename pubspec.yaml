name: adaptive_test_plus
description: >-
  Adaptive golden tests for Flutter: devices, light/dark themes and locales.
  A maintained, drop-in compatible continuation of adaptive_test.
issue_tracker: https://github.com/monawebapp/adaptive_test_plus/issues
topics:
  - testing
  - golden
  - widget-test
  - screenshot
version: 0.11.0
homepage: https://github.com/monawebapp/adaptive_test_plus
repository: https://github.com/monawebapp/adaptive_test_plus

environment:
  sdk: '>=3.0.5 <4.0.0'
  flutter: '>=1.17.0'

dependencies:
  cupertino_icons: ^1.0.5
  equatable: ^2.0.5
  file: ^7.0.0
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  meta: ^1.8.0
  package_config: ^2.1.0
  path: ^1.8.2
  platform: ^3.1.0
  recase: ^4.0.0

dev_dependencies:
  theodo_analysis: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    # Add assets from the images directory to the application.
    - assets/keyboards/
