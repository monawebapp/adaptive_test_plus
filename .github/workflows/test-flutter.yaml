name: Format and test on push
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: .
            name: package
          - dir: example/simple_app
            name: simple_app
          - dir: example/multi_packages_app/app
            name: multi_packages_app_app
          - dir: example/multi_packages_app/theme
            name: multi_packages_app_theme
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v2

      - id: fvm-config
        uses: kuhnroyal/flutter-fvm-config-action/config@v3

      - uses: subosito/flutter-action@v2.5.0
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config.outputs.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-macos-${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          cache-path: ${{ runner.tool_cache }}/flutter-${{ steps.fvm-config.outputs.FLUTTER_VERSION }}

      - name: Install Dependencies
        run: flutter packages get

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test --no-pub --test-randomize-ordering-seed random

      - name: Upload golden test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.name }}
          path: ${{ matrix.dir }}/test/**/failures/
          if-no-files-found: ignore
