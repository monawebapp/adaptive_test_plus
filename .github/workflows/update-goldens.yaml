name: Format and update goldens
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - id: fvm-config
        uses: kuhnroyal/flutter-fvm-config-action/config@v3

      - uses: subosito/flutter-action@v2.5.0
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config.outputs.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-macos-${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          cache-path: ${{ runner.tool_cache }}/flutter-${{ steps.fvm-config.outputs.FLUTTER_VERSION }}

      - name: Format
        run: dart format lib test example

      - name: Regenerate goldens
        run: |
          for dir in example/simple_app example/multi_packages_app/app example/multi_packages_app/theme; do
            (cd "$dir" && flutter pub get && flutter test --update-goldens)
          done

      - name: Commit goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib test example
          git diff --cached --quiet || git commit -m "chore: format and update goldens"
          git push
