name: multi_packages_example_app
description: A multi packages Flutter app to illustrate the package adaptive_test_plus. This "multi_packages_app" package holds the app related code

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.2
  flutter:
    sdk: flutter
  multi_packages_example_theme:
    path: '../theme'

dev_dependencies:
  adaptive_test_plus:
    path: ../../../

  flutter_test:
    sdk: flutter
  theodo_analysis: ^1.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/dash.png